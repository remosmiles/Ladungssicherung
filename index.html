<div class="glass-container adr-tool">
    <header>
        <div class="badge adr">ADR / SDR CHECK</div>
        <h1>GEFAHRGUT<span>RECHNER</span></h1>
        <p>1000-PUNKTE-REGEL & BESTIMMUNGEN</p>
    </header>

    <div class="adr-input-section">
        <div class="input-card main">
            <label>UN-Nummer</label>
            <input type="text" id="un-input" placeholder="z.B. 1202" maxlength="4">
        </div>
        <div class="input-card main">
            <label>Menge (kg/L)</label>
            <input type="number" id="adr-menge" placeholder="0">
        </div>
    </div>

    <div id="adr-result" class="adr-display" style="display: none;">
        <div class="adr-header">
            <div id="adr-un-name" class="un-name">UN 1202 DIESELKRAFTSTOFF</div>
            <div id="adr-class" class="class-badge">KLASSE 3</div>
        </div>
        
        <div class="points-visual">
            <div class="points-bar">
                <div id="points-fill" class="fill"></div>
            </div>
            <div class="points-text"><span id="calc-points">0</span> / 1000 PUNKTE</div>
        </div>

        <div id="adr-warnings" class="warning-list">
            </div>
    </div>
</div>
