<div class="glass-container">
    <header>
        <div class="badge">HEAVY DUTY MODE</div>
        <h1>PKO1<span>SATTELZUG</span></h1>
        <p>ACHSLAST-ANALYSE KOMPLETTZUG</p>
    </header>

    <main class="measurement-space">
        <div class="axle-group" data-axle="1">
            <div class="input-card left" data-label="VL">
                <input type="number" id="vl" placeholder="0" class="weight-input">
            </div>
            <div class="axle-visual">
                <div class="axle-name">LENKACHSE</div>
                <div class="axle-sum"><span id="sum-v">0</span> kg</div>
            </div>
            <div class="input-card right" data-label="VR">
                <input type="number" id="vr" placeholder="0" class="weight-input">
            </div>
        </div>

        <div class="axle-group" data-axle="2">
            <div class="input-card left" data-label="AL">
                <input type="number" id="al" placeholder="0" class="weight-input">
            </div>
            <div class="axle-visual drive">
                <div class="axle-name">ANTRIEBSACHSE</div>
                <div class="axle-sum"><span id="sum-a">0</span> kg</div>
            </div>
            <div class="input-card right" data-label="AR">
                <input type="number" id="ar" placeholder="0" class="weight-input">
            </div>
        </div>

        <div class="axle-group" data-axle="3">
            <div class="input-card left" data-label="SL">
                <input type="number" id="sl" placeholder="0" class="weight-input">
            </div>
            <div class="axle-visual trailer">
                <div class="axle-name">AUFLIEGERACHSEN</div>
                <div class="axle-sum"><span id="sum-s">0</span> kg</div>
            </div>
            <div class="input-card right" data-label="SR">
                <input type="number" id="sr" placeholder="0" class="weight-input">
            </div>
        </div>

        <div class="truck-chassis-visual">
            <div id="target-point" class="cog-dot"></div>
            <div class="truck-outline"></div>
        </div>
    </main>

    <footer class="live-dashboard">
        <div class="data-tile">
            <label>GESAMTGEWICHT</label>
            <div class="value primary" id="total-weight">0 kg</div>
        </div>
        <div class="data-tile">
            <label>L/R DIFFERENZ</label>
            <div class="value" id="lr-diff">0 kg</div>
        </div>
        <div class="data-tile" id="status-tile">
            <label>STATUS</label>
            <div class="value" id="status-text">BEREIT</div>
        </div>
    </footer>
</div>
