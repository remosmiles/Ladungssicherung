<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PKO1 | Advanced Axle Control</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glass-container">
        <header>
            <div class="badge">SYSTEM AKTIV</div>
            <h1>ACHSLAST<span>ANALYSE</span></h1>
            <p>PRÄZISIONSMESSUNG PKO1</p>
        </header>

        <main class="measurement-space">
            <div class="axle-group">
                <div class="input-card left" data-label="Vorne Links">
                    <input type="number" id="vl" placeholder="0" class="weight-input">
                    <span>kg</span>
                </div>
                
                <div class="axle-visual">
                    <div class="axle-line"></div>
                    <div class="axle-sum"><span id="sum-v">0</span> kg</div>
                </div>

                <div class="input-card right" data-label="Vorne Rechts">
                    <input type="number" id="vr" placeholder="0" class="weight-input">
                    <span>kg</span>
                </div>
            </div>

            <div class="vehicle-body">
                <div id="target-point" class="cog-dot"></div>
                <div class="center-axis"></div>
            </div>

            <div class="axle-group">
                <div class="input-card left" data-label="Hinten Links">
                    <input type="number" id="hl" placeholder="0" class="weight-input">
                    <span>kg</span>
                </div>
                
                <div class="axle-visual">
                    <div class="axle-line"></div>
                    <div class="axle-sum"><span id="sum-h">0</span> kg</div>
                </div>

                <div class="input-card right" data-label="Hinten Rechts">
                    <input type="number" id="hr" placeholder="0" class="weight-input">
                    <span>kg</span>
                </div>
            </div>
        </main>

        <footer class="live-dashboard">
            <div class="data-tile">
                <label>Gesamtmasse</label>
                <div class="value" id="total-weight">0 kg</div>
            </div>
            <div class="data-tile">
                <label>Differenz L/R</label>
                <div class="value" id="lr-diff">0 kg</div>
            </div>
            <div class="data-tile" id="balance-tile">
                <label>Status</label>
                <div class="value" id="status-text">WAITING</div>
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
