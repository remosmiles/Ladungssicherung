<div class="glass-container clean-design adr-module">
    <header class="module-header">
        <div class="icon-circle">☢️</div>
        <div class="title-group">
            <h2>Gefahrgut-Inspektor</h2>
            <p>SDR & Tunnelbeschränkungen Schweiz</p>
        </div>
    </header>

    <div class="input-section-clean">
        <div class="input-field">
            <label>UN-Nummer</label>
            <input type="text" id="un-num" placeholder="z.B. 1203" maxlength="4">
        </div>
        <div class="input-field">
            <label>Gewicht / Volumen</label>
            <input type="number" id="un-weight" placeholder="in kg oder Liter">
        </div>
        <button id="check-btn" class="btn-check">SDR Bestimmungen abfragen</button>
    </div>

    <div id="adr-results" class="results-area hidden">
        <div class="result-card main-info">
            <h3 id="res-name">UN 1203 BENZIN</h3>
            <div class="badge-row">
                <span class="tag orange" id="res-class">Klasse 3</span>
                <span class="tag grey" id="res-cat">Bef.-Kat. 2</span>
            </div>
        </div>

        <div class="result-grid">
            <div class="info-box">
                <h4>Tunnel-Zulassung</h4>
                <div id="tunnel-info" class="tunnel-list">
                    </div>
            </div>
            <div class="info-box">
                <h4>SDR Bestimmungen</h4>
                <ul id="rules-list" class="check-list">
                    </ul>
            </div>
        </div>
        
        <div class="points-indicator">
            <div class="points-label">1000-Punkte Status: <strong id="pts-val">0</strong> / 1000</div>
            <div class="progress-bar"><div id="pts-bar" class="progress"></div></div>
        </div>
    </div>
</div>
