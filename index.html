<div class="card analysis-container">
    <div class="header-flex">
        <h2>⚖️ Achslast-Protokoll (4 Waagtische)</h2>
        <div class="limit-status" id="global-status">BEREIT</div>
    </div>

    <div class="truck-blueprint">
        <div class="axle-block front">
            <div class="wheel-input left">
                <label>VL (kg)</label>
                <input type="number" id="v-links" placeholder="0" oninput="calculateTruck()">
            </div>
            <div class="axle-line">
                <span id="axle-1-total">0</span> kg
                <small>Achse 1</small>
            </div>
            <div class="wheel-input right">
                <label>VR (kg)</label>
                <input type="number" id="v-rechts" placeholder="0" oninput="calculateTruck()">
            </div>
        </div>

        <div class="chassis-bridge">
            <div id="cog" class="center-of-gravity"></div>
        </div>

        <div class="axle-block rear">
            <div class="wheel-input left">
                <label>HL (kg)</label>
                <input type="number" id="h-links" placeholder="0" oninput="calculateTruck()">
            </div>
            <div class="axle-line">
                <span id="axle-2-total">0</span> kg
                <small>Achse 2</small>
            </div>
            <div class="wheel-input right">
                <label>HR (kg)</label>
                <input type="number" id="h-rechts" placeholder="0" oninput="calculateTruck()">
            </div>
        </div>
    </div>

    <div class="results-table">
        <div class="res-row">
            <span>Gesamtgewicht:</span>
            <strong id="total-weight">0 kg</strong>
        </div>
        <div class="res-row">
            <span>Verteilung Links / Rechts:</span>
            <span id="lr-distribution">50% / 50%</span>
        </div>
        <div class="res-row" id="diff-warning">
            <span>Differenz L/R:</span>
            <strong id="lr-diff">0 kg</strong>
        </div>
    </div>
</div>
